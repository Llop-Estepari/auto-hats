name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Arch Linux AppImage
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          pacman -Syu --noconfirm --needed \
            python tk squashfs-tools zstd file \
            desktop-file-utils curl git github-cli

      - name: Instalar PyInstaller
        run: |
          python -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip pyinstaller
          /opt/venv/bin/pyinstaller --version

      - name: Calcular versión
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export PATH="/opt/venv/bin:$PATH"
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Auto-HATS-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.AppImage \
            --title "Auto HATS ${{ steps.version.outputs.value }}" \
            --notes "AppImage para Linux (x86_64), compilado en Arch Linux."
